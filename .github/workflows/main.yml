name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepara app
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/share@6
          npx cap init MemoryJW com.memoryjw.app --web-dir www
          npx cap add android
          npx cap sync android
      - name: Costruisci APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Rinomina
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MemoryJW.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: MemoryJW.apk
